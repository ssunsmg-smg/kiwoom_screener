name: 키움 자동매매 (장중 15분 — 통합전략 v1 / 퀀트 v41f 전환식)
on:
  schedule:
    # [v3] 정각·15분 배수(:00 :15 :30 :45)는 GitHub 전체 트래픽이 몰려 대량 드랍된다.
    #      4분씩 비켜서 등록 → 드랍이 줄어든다. (외부 트리거가 주력, 이건 백업)
    - cron: '4,19,34,49 0-5 * * 1-5'   # 한국시간 09:04~14:49, 평일
    - cron: '4,19 6 * * 1-5'           # 한국시간 15:04, 15:19 (마감 전 청산 체크)
  # ⚠ [v2 확인사항] GitHub의 */15 스케줄은 대량 드랍됨이 실측으로 확인됨
  #   (설정상 하루 28회여야 하는데 실제 실행은 3~4회, 간격 2시간+).
  #   아래 주석의 cron-job.org 계획이 실제로는 동작하지 않고 있었음
  #   (실행 이력이 전부 "Scheduled"로 찍힘 = 외부 트리거 미작동).
  #   → cron-job.org 계정에서 이 워크플로 트리거를 재등록/활성화하고,
  #     quant_daily.yml 쪽 트리거(7/29 이후 정지)도 함께 확인할 것.
  #   외부 트리거가 복구되면 위 schedule은 백업으로 남겨두면 됨.
 # workflow_dispatch:
#on:
  # ── 스케줄(cron) 트리거 없음 — quant_trade.yml(KIS)과 동일한 정책 ──
  # GitHub Actions의 schedule 트리거는 정시 실행을 보장하지 않아서,
  # 외부 cron 서비스(cron-job.org)가 GitHub API로 이 워크플로를 직접 트리거합니다.
  #
  # ⚠ KIS용 quant_trade.yml과 다른 점: 이 워크플로는 quant_signal_check.py를
  #   돌리는데, 이 스크립트는 원래 "장중 09:05~15:00 사이 10~15분 간격으로
  #   반복 실행"하는 용도로 설계되어 있다 (--trade-only처럼 하루 1번이 아님).
  #   → cron-job.org에 이 워크플로를 가리키는 트리거를 "여러 개" 등록해서
  #     장중에 10~15분 간격으로 반복 호출해야 한다 (예: 09:05, 09:20, 09:35... 14:50).
  #     1개만 등록하면 그날 단 한 번만 매수 시도하고 끝남.

  # ── 수동 실행 버튼 (테스트/비상용) ──
  workflow_dispatch:
    inputs:
      exit_dry_run:
        description: '청산 dry-run (true면 매도주문 없이 판정만 출력)'
        required: false
        default: 'false'

permissions:
  contents: write   # 거래상태(kiwoom_positions/kiwoom_reinvest_pool/intraday_pending/exit_state)를 레포에 커밋하기 위해 필요

# [v3] 같은 브랜치에 push 하는 워크플로우(quant_daily / box_paper)와 겹치지 않게 직렬화
#      겹치면 push 가 거절돼 거래상태가 저장되지 않는다
concurrency:
  group: kiwoom-trading-state
  cancel-in-progress: false

jobs:
  kiwoom-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ① 레포지터리 체크아웃 (전날 커밋된 signals/ 폴더 포함)
      - name: 레포지터리 체크아웃
        uses: actions/checkout@v4

      # ② Python 설치
      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ③ 패키지 설치
      - name: 패키지 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ④ signals/ 폴더의 가장 최근 매매신호 JSON을 작업 루트로 복사
      #    (quant_signal_check.py는 --output-dir 안의 매매신호_KR_*.json을 찾으므로)
      #    [v2] 신호 파일이 없어도 "청산은" 돌아야 하므로 exit 1 제거 —
      #         매수 단계만 스킵되고 보유종목 청산 체크는 항상 실행된다.
      #    [v2] 신호 파일이 5거래일 이상 묵으면 매수를 건너뛰게 경고 플래그 생성
      #         (7/29 신호로 8/14에 매수한 사고 재발 방지)
      - name: 매매신호 JSON 준비
        id: signals
        run: |
          if [ -z "$(ls -A signals/*.json 2>/dev/null)" ]; then
            echo "⚠ signals/ 폴더에 매매신호 JSON이 없습니다 — 이번 실행은 청산만 수행."
            echo "buy_enabled=false" >> "$GITHUB_OUTPUT"
          else
            # [v3 버그수정] 예전 방식(파일 수정일 date -r)은 항상 0일로 나왔다.
            #   actions/checkout 이 파일을 새로 받으면서 수정일이 '지금'으로 바뀌기 때문.
            #   → 몇 달 묵은 신호로도 매수할 수 있었음.
            #   이제 파일 이름의 날짜(매매신호_KR_YYYYMMDD_HHMMSS.json)로 계산하고,
            #   최신 파일 1개만 작업 폴더에 둔다 (오래된 신호가 섞이지 않게).
            newest=$(ls signals/매매신호_KR_*.json | sort | tail -1)
            cp "$newest" .
            echo "▶ 신호 파일 준비 완료: $newest"
            sig_date=$(basename "$newest" | grep -o '20[0-9]\{6\}' | head -1)
            if [ -z "$sig_date" ]; then
              echo "⚠ 신호 파일 이름에서 날짜를 못 읽음 — 안전하게 매수 스킵"
              age_days=999
            else
              age_days=$(( ( $(TZ=Asia/Seoul date +%s) - $(TZ=Asia/Seoul date -d "$sig_date" +%s) ) / 86400 ))
            fi
            echo "▶ 신호일 ${sig_date:-?} (경과 ${age_days}일)"
            if [ "$age_days" -ge 7 ]; then
              echo "⚠ 신호가 ${age_days}일 묵음 — 스크리너(quant_daily.yml) 트리거가 죽었을 가능성. 매수 스킵."
              echo "buy_enabled=false" >> "$GITHUB_OUTPUT"
            else
              echo "buy_enabled=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # ⑤ 직전 실행에서 커밋해둔 거래상태 복원
      #    [v2] kiwoom_exit_state.json (청산 상태: 부분익절 플래그/최고가) 추가
      #    [v3] kiwoom_trades.json (체결 기록 — 매매 현황판·텔레그램 일일요약용) 추가
      - name: 거래상태 복원
        run: |
          mkdir -p trades trade_state_kiwoom
          for f in kiwoom_positions.json kiwoom_reinvest_pool.json kiwoom_exit_state.json kiwoom_trades.json unified_state.json; do
            if [ -f trade_state_kiwoom/$f ]; then
              cp trade_state_kiwoom/$f trades/$f
              echo "▶ $f 복원 완료"
            else
              echo "▶ 저장된 $f 없음 (최초 실행)"
            fi
          done
          if ls trade_state_kiwoom/intraday_pending_*.json >/dev/null 2>&1; then
            cp trade_state_kiwoom/intraday_pending_*.json trades/
            echo "▶ intraday_pending 복원 완료"
          else
            echo "▶ 저장된 intraday_pending 없음 (오늘 첫 실행)"
          fi

      # ⑥ 키움 설정파일 생성 (secrets에서 읽어와 매 실행마다 생성)
      #    ★ 모의투자 단계에서는 KIWOOM_IS_REAL 시크릿을 "false"로 등록
      #    [v2] 청산 파라미터 추가: tp1_sell_ratio(1차익절 매도비율),
      #         trail_giveback_pct(트레일링 반납허용%).
      #    ⚠ take_profit_min_pct 2.0은 거래비용 감안 시 얇음 — 5.0으로 상향함.
      #      (기존 2.0으로 되돌리려면 아래 값만 수정)
      - name: 키움 설정파일 생성
        run: |
          cat > kiwoom_config.json << EOF
          {
            "app_key":             "${{ secrets.KIWOOM_APP_KEY }}",
            "app_secret":          "${{ secrets.KIWOOM_APP_SECRET }}",
            "is_real":             ${{ secrets.KIWOOM_IS_REAL }},
            "max_daily_trades":    10,
            "stop_loss_pct":       7.0,
            "take_profit_min_pct": 5.0,
            "take_profit_max_pct": 25.0,
            "tp1_sell_ratio":      0.30,
            "trail_giveback_pct":  5.0,
            "base_invest_amount":  10000000,
            "reinvest_mode":       true,
            "buy_top_n":           20
          }
          EOF
          echo "▶ 키움 설정파일 생성 완료 (is_real=${{ secrets.KIWOOM_IS_REAL }})"

      # ⑦ 텔레그램 설정파일 생성 (KIS와 같은 채널로 알림 — 메시지 앞에 [키움] 식별 권장)
      - name: 텔레그램 설정파일 생성
        run: |
          cat > telegram_config.json << EOF
          {
            "bot_token": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
            "chat_id":   "${{ secrets.TELEGRAM_CHAT_ID }}"
          }
          EOF
          echo "▶ 텔레그램 설정파일 생성 완료"

      # ── [v4] 전략 전환 스위치 ──────────────────────────────────────
      #   저장소 Settings → Secrets and variables → Actions → Variables 탭에서
      #   TRADE_STRATEGY 변수를 만들 수 있다.
      #     (없음 또는 unified) → 통합전략 v1 (박스 눌림 매수 + 절반익절·트레일링 매도)
      #     v41f                → 예전 퀀트 v41f (게이트 매수 + 기존 청산)
      #   한 계좌에서 두 전략이 동시에 주문하면 서로의 손절·익절이 엉키므로 하나만 돈다.
      # ────────────────────────────────────────────────────────────────

      # ⑧-U 통합전략 v1 — 매도 점검 → 매수 점검 (보유 중인 v41f 종목도 같은 매도 규칙으로 관리)
      - name: 🎯 통합전략 v1 (매도·매수)
        if: vars.TRADE_STRATEGY != 'v41f'
        run: |
          FLAG=""
          if [ "${{ github.event.inputs.exit_dry_run }}" = "true" ]; then FLAG="--dry-run"; fi
          python unified_strategy.py run $FLAG
          echo "▶ 통합전략 실행 완료"

      # ⑧-A (v41f 전용) 보유종목 청산 체크
      - name: "🔻 [v41f] 보유종목 청산 체크 (손절/익절/트레일링)"
        if: vars.TRADE_STRATEGY == 'v41f'
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.exit_dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
            echo "▶ dry-run 모드: 매도주문 없이 판정만 출력"
          fi
          python quant_exit_check.py --broker kiwoom --output-dir . $DRY_FLAG
          echo "▶ 청산 체크 완료"

      # ⑧-B (v41f 전용) L1+L2 게이트 체크 → 통과 종목 매수
      - name: "[v41f] 키움 자동매매 실행 (매수)"
        if: vars.TRADE_STRATEGY == 'v41f' && steps.signals.outputs.buy_enabled == 'true'
        run: |
          python quant_signal_check.py --broker kiwoom --interval 5 --output-dir .
          echo "▶ 실행 완료"

      # ⑨ 설정파일 삭제 (아티팩트에 절대 포함되지 않도록)
      - name: 설정파일 삭제
        if: always()
        run: rm -f kiwoom_config.json telegram_config.json

      # ⑩ 거래상태 다음 실행을 위해 레포에 커밋
      #    [v2] kiwoom_exit_state.json 추가
      #    ⚠ 계좌 보유종목·수량이 git 히스토리에 평문으로 남음 — 레포가
      #      private인지 다시 한번 확인할 것 (KIS 쪽 trade_state/와 동일한 주의사항).
      - name: 거래상태 커밋
        if: always()
        run: |
          mkdir -p trade_state_kiwoom
          for f in kiwoom_positions.json kiwoom_reinvest_pool.json kiwoom_exit_state.json kiwoom_trades.json unified_state.json; do
            cp trades/$f trade_state_kiwoom/$f 2>/dev/null || echo "▶ $f 없음"
          done
          if ls trades/intraday_pending_*.json >/dev/null 2>&1; then
            cp trades/intraday_pending_*.json trade_state_kiwoom/
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_state_kiwoom/
          if git diff --staged --quiet; then
            echo "▶ 변경사항 없음 — 커밋 스킵"
          else
            git commit -m "키움 거래상태 갱신 ${{ github.run_number }} ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
            # [v3] push 충돌 시 rebase 후 재시도 (예전엔 한 번 실패하면 거래상태가 유실)
            for i in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "▶ push 성공"; break; fi
              echo "▶ push 충돌 — rebase 후 재시도 ($i/3)"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              sleep 5
            done
          fi

      # ⑪ 거래로그 + 분봉/게이트 로그 아티팩트 저장 (90일 보관)
      - name: 📊 거래로그 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 키움거래로그-${{ github.run_number }}-${{ github.run_id }}
          path: trades/*.json
          retention-days: 90
          if-no-files-found: warn
